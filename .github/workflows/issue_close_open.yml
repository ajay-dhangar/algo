name: Issue Auto Comment

on:
  issues:
    types: [opened, closed]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Handle Issue Activity Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const creator = issue.user.login;
            const action = context.payload.action;
            
            let commentBody = "";
            
            if (action === "opened") {
              commentBody = `### 👋 Thanks for opening this issue, @${creator}!\n\n` +
                            `We appreciate you taking the time to help improve our Algo project! 🚀\n\n` +
                            `To help us address this effectively, please make sure you've included:\n` +
                            `* 📝 **Clear description** of the problem or feature request.\n` +
                            `* 💻 **Code snippets** or error steps (especially for algorithmic edge cases).\n` +
                            `* 🖼️ **Screenshots** or visual context if applicable.\n\n` +
                            `Please ensure you adhere to our project's **Guidelines** and **Code of Conduct**. A maintainer will review it shortly. Happy coding! ✨`;
                            
            } else if (action === "closed") {
              const wasClosedViaPR = issue.pull_request !== undefined;

              if (wasClosedViaPR) {
                commentBody = `### ✅ Issue Resolved & Closed\n\n` +
                              `Thank you, @${creator}, for your contributions to our Algo project! 🌟\n\n` +
                              `Your pull request has successfully resolved this issue. Your involvement keeps this educational platform growing. Happy coding! 🚀`;
              } else {
                commentBody = `### 🔒 Issue Closed\n\n` +
                              `Thank you, @${creator}, for taking the time to report or engage with this issue! 🛡️\n\n` +
                              `Even if this was closed without a direct code merge, your input helps us manage and track our algorithm roadmap effectively.`;
              }
            }
            
            if (commentBody) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
            }
            
